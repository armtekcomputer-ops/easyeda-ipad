name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - work/BUILD-008/chat-20260921T135900Z-agent1-build008

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile bootstrap
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: build-008-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Install dependencies from generated lockfile
        run: npm ci --no-audit --no-fund

      - name: Test EasyEDA command layer
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Generate Worker types and typecheck
        run: npm run worker:typecheck

      - name: Validate Worker bundle and config
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Syntax-check direct companion
        run: node --check companion/server.mjs

      - name: Syntax-check VPS cloud agent
        run: node --check companion/cloud-agent.mjs
